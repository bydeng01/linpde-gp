version: '3.8'

services:
  linpde-gp:
    build: .
    container_name: linpde-gp-dev
    volumes:
      # Mount the current directory to /app in the container
      - .:/app
      # Mount a volume for pip cache to speed up rebuilds
      - pip-cache:/root/.cache/pip
    ports:
      # Map port 8888 for Jupyter notebook
      - "8888:8888"
      # Map port 8000 for potential web servers
      - "8000:8000"
    environment:
      - PYTHONPATH=/app/src
    # Memory budget: lets a transient Gram-assembly spike spill to swap
    # instead of being OOM-killed. On macOS/Windows these are still bounded
    # by the Docker Desktop VM total (Settings -> Resources -> Memory/Swap),
    # so raise the VM allocation first.
    mem_limit: 24g
    memswap_limit: 48g     # 24g RAM + 24g swap
    # Keep container running for interactive use
    stdin_open: true
    tty: true
    working_dir: /app

volumes:
  pip-cache: 